<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>서울형사 피싱X</title>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-512.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        background-color: #f8fafc !important;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      /* 인트로 화면에 원본 이미지(splash.jpg) 100% 그대로 표시 */
      .fixed.inset-0.bg-black {
        top: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        z-index: 2147483647 !important;
        background: #000000 url("/splash.jpg") no-repeat center center !important;
        background-size: cover !important;
      }
      /* 기존 어색한 코드 글자·도형 숨김 */
      .fixed.inset-0.bg-black > * {
        display: none !important;
      }
      /* PC 등 가로로 넓은 화면에서도 위아래 잘림 없이 표시 */
      @media (min-aspect-ratio: 3/4) {
        .fixed.inset-0.bg-black {
          background-size: contain !important;
        }
      }
      nav { z-index: 40 !important; }
      svg { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
